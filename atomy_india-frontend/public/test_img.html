<!DOCTYPE html>
<html>
<head>
<style>
body { background: #00A3E0; padding: 40px; font-family: sans-serif; }
.brand-logo-wrapper {
  display: inline-flex;
  align-items: flex-start;
  gap: 12px;
}
.brand-logo-img {
  height: 48px;
  width: auto;
  display: block;
}
.brand-arrow-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.6px solid #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  margin-top: 5px;
}
</style>
</head>
<body>
<div class="brand-logo-wrapper">
  <img src="/atomy-logo.png" class="brand-logo-img" />
  <div class="brand-arrow-circle">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>
</div>
</body>
</html>
